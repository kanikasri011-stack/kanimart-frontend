<!DOCTYPE html>
<html>
<head>
    <title>Products - KaniMart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🛍️ KaniMart Products</h1>
    
    <div>
        <a href="cart.html">🛒 View Cart (<span id="cartCount">0</span>)</a> | 
        <a href="login.html">Logout</a>
    </div>
    <hr>

    <div id="productList" style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
        <p>Loading products...</p>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById("cartCount").innerText = cart.length;

        // Default products with image paths & fallback URLs
        const defaultProducts = [
            { 
                id: 1, 
                name: "Laptop", 
                price: 45000, 
                stock: 10, 
                image: "images/laptop.jpg" 
            },
            { 
                id: 2, 
                name: "Mobile Phone", 
                price: 18000, 
                stock: 15, 
                image: "images/mobile.jpg" 
            },
            { 
                id: 3, 
                name: "Headphones", 
                price: 2000, 
                stock: 25, 
                image: "images/headphones.jpg" 
            },
            { 
                id: 4, 
                name: "Bread", 
                price: 40, 
                stock: 30, 
                image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" 
            },
            { 
                id: 5, 
                name: "Butter 500g", 
                price: 250, 
                stock: 20, 
                image: "https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=300" 
            }
        ];

        async function loadProducts() {
            try {
                let response = await fetch("http://127.0.0.1:18080/api/products");
                let data = await response.json();

                if (data.status === "success" && data.products.length > 0) {
                    renderProducts(data.products);
                } else {
                    renderProducts(defaultProducts);
                }
            } catch (error) {
                console.log("C++ Backend offline. Loading default items.");
                renderProducts(defaultProducts);
            }
        }

        function renderProducts(products) {
            let container = document.getElementById("productList");
            container.innerHTML = "";

            products.forEach(product => {
                let card = document.createElement("div");
                card.style.border = "1px solid #ccc";
                card.style.padding = "15px";
                card.style.borderRadius = "8px";
                card.style.width = "200px";
                card.style.textAlign = "center";
                card.style.boxShadow = "0 2px 5px rgba(0,0,0,0.1)";

                // Default image if missing in backend data
                let imgSrc = product.image || "https://via.placeholder.com/150";

                card.innerHTML = `
                    <img src="${imgSrc}" alt="${product.name}" style="width: 100%; height: 140px; object-fit: cover; border-radius: 5px; margin-bottom: 10px;">
                    <h3>${product.name}</h3>
                    <p><strong>Price:</strong> ₹${product.price}</p>
                    <button onclick="addToCart('${product.name}', ${product.price})" style="padding: 8px 12px; background-color: #ff9800; color: white; border: none; border-radius: 4px; cursor: pointer;">Add to Cart 🛒</button>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(name, price) {
            cart.push({ name: name, price: price });
            localStorage.setItem("cart", JSON.stringify(cart));
            document.getElementById("cartCount").innerText = cart.length;
            alert(`${name} added to cart!`);
        }

        loadProducts();
    </script>
</body>
</html>

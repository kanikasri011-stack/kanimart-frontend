<!DOCTYPE html>
<html>
<head>
    <title>Login - KaniMart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🔑 User Login</h1>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <label>Email Address:</label><br>
        <input type="email" id="loginEmail" required placeholder="Enter email"><br><br>

        <label>Password:</label><br>
        <input type="password" id="loginPassword" required placeholder="Enter password"><br><br>

        <button type="submit" style="background-color: #007bff; color: white;">Login</button>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </form>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            let email = document.getElementById("loginEmail").value;
            let name = email.split('@')[0];

            localStorage.setItem("userName", name);
            alert(`Welcome back, ${name}!`);
            window.location.href = "products.html";
        }
    </script>
</body>
</html>

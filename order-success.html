<!DOCTYPE html>
<html>
<head>
    <title>Order Success - KaniMart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎉 Order Placed Successfully!</h1>
    <h2>Thank you for shopping with KaniMart!</h2>

    <div id="orderDetails" style="border: 1px solid #ccc; padding: 15px; margin: 20px 0;">
        <h3>Order Summary</h3>
        <p><strong>Customer Name:</strong> <span id="outName"></span></p>
        <p><strong>Phone:</strong> <span id="outPhone"></span></p>
        <p><strong>Delivery Address:</strong> <span id="outAddress"></span></p>
        <p><strong>Payment Mode:</strong> <span id="outPayment"></span></p>
    </div>

    <button onclick="finishShopping()">Return to Home / Products</button>

    <script>
        let order = JSON.parse(localStorage.getItem("lastOrder"));

        if (order) {
            document.getElementById("outName").innerText = order.customerName;
            document.getElementById("outPhone").innerText = order.phone;
            document.getElementById("outAddress").innerText = order.address;
            document.getElementById("outPayment").innerText = order.paymentMethod;
        }

        function finishShopping() {
            localStorage.removeItem("cart");
            window.location.href = "products.html";
        }
    </script>
</body>
</html>
